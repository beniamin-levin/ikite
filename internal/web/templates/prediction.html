<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-theme="{{theme}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{T "title.prediction"}}</title>
  {{template "head_common" .}}
  <style>
    .pred { max-width: 720px; }
    .pred .card { margin-bottom: 12px; }
    .pred .card h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 6px;
      font-weight: 600;
    }
    .pred .card p { margin: 0; font-size: 1.125rem; font-weight: 500; }
    .pred .card.highlight {
      background: rgba(86, 221, 123, 0.12);
      border-color: rgba(86, 221, 123, 0.35);
    }
    .status { color: var(--muted); font-size: 0.875rem; margin-top: 12px; }
    .err { color: var(--err); }
    .hours-wrap { overflow-x: auto; margin-top: 16px; }
    .hours {
      border-collapse: collapse;
      width: 100%;
      background: var(--table-bg);
      color: var(--text);
      font-size: 0.85rem;
    }
    .hours th, .hours td {
      border: 1px solid var(--line);
      padding: 4px 6px;
      text-align: center;
      white-space: nowrap;
      color: var(--text);
    }
    .hours th { background: var(--table-th-bg); font-weight: 600; }
    .hours th.peak, .hours td.peak {
      background: rgba(86, 221, 123, 0.16);
      border-color: rgba(86, 221, 123, 0.4);
      font-weight: 700;
    }
  </style>
</head>
<body>
  {{template "nav" .}}
  <main class="page pred">
    <h1>{{T "prediction.heading"}}</h1>
    <p class="muted" id="meta">{{T "prediction.loading"}}</p>
    <div id="content">
      <p class="status">{{T "prediction.analyzing"}}</p>
    </div>
  </main>

  <script>
    (function () {
      const I = window.I18N || {};
      const t = function (k) { return I[k] || k; };
      const content = document.getElementById('content');
      const meta = document.getElementById('meta');

      fetch('/api/prediction', { credentials: 'same-origin' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (d) {
          const source = d.source ? d.source : 'history';
          meta.textContent = d.date + ' · ' + t('prediction.meta_source') + ' ' + source +
            (d.similar_days != null ? ' · ' + t('prediction.meta_similar').replace('%d', d.similar_days) : '') +
            (d.based_on_readings ? ' · ' + t('prediction.meta_readings').replace('%d', Number(d.based_on_readings).toLocaleString()) : '');
          let html =
            '<div class="card highlight"><h2>' + esc(t('prediction.strongest')) + '</h2><p>' + esc(d.strongest_window) + '</p></div>' +
            '<div class="card"><h2>' + esc(t('prediction.expected_peak')) + '</h2><p>' + esc(d.expected_peak) + '</p></div>' +
            '<div class="card"><h2>' + esc(t('prediction.direction')) + '</h2><p>' + esc(d.direction) + '</p></div>' +
            '<div class="card"><h2>' + esc(t('prediction.good_window')) + '</h2><p>' + esc(d.good_window) + '</p></div>' +
            '<div class="card"><h2>' + esc(t('prediction.wind_down')) + '</h2><p>' + esc(d.wind_down) + '</p></div>';
          if (d.openwrf && d.openwrf.hours && d.openwrf.hours.length) {
            const win = parseWindow((d.openwrf.strongest_window || d.strongest_window) || '');
            html += '<h2 style="font-size:1rem;margin:20px 0 8px">' + esc(t('prediction.openwrf_timeline')) + '</h2><div class="hours-wrap"><table class="hours"><thead><tr>';
            d.openwrf.hours.forEach(function (h) {
              html += '<th' + (inWindow(h.time, win) ? ' class="peak"' : '') + '>' + esc(h.time) + '</th>';
            });
            html += '</tr></thead><tbody><tr>';
            d.openwrf.hours.forEach(function (h) {
              html += '<td' + (inWindow(h.time, win) ? ' class="peak"' : '') + '>' +
                Math.round(h.wind) + '-' + Math.round(h.gust) + '</td>';
            });
            html += '</tr></tbody></table></div>';
          }
          if (d.conditions) html += '<p class="status">' + esc(d.conditions) + '</p>';
          if (d.history && d.history.summary) html += '<p class="status">' + esc(t('prediction.past_accuracy')) + ': ' + esc(d.history.summary) + '</p>';
          if (d.current) html += '<p class="status">' + esc(t('prediction.now')) + ': ' + esc(d.current) + '</p>';
          content.innerHTML = html;
          scrollToStrongest();
        })
        .catch(function (e) {
          content.innerHTML = '<p class="err">' + esc(t('prediction.failed')) + ': ' + esc(e.message) + '</p>';
          meta.textContent = '';
        });

      function parseWindow(s) {
        const m = String(s).match(/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})/);
        if (!m) return null;
        return { start: m[1], end: m[2] };
      }

      function timeToMin(t) {
        const p = String(t).split(':');
        return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
      }

      function inWindow(t, win) {
        if (!win || !t) return false;
        const v = timeToMin(t);
        return v >= timeToMin(win.start) && v <= timeToMin(win.end);
      }

      function scrollToStrongest() {
        const wrap = content.querySelector('.hours-wrap');
        const peak = content.querySelector('.hours th.peak');
        if (!wrap || !peak) return;
        const left = peak.offsetLeft - (wrap.clientWidth / 2) + (peak.offsetWidth / 2);
        wrap.scrollLeft = Math.max(0, left);
      }

      function esc(s) {
        const el = document.createElement('span');
        el.textContent = s == null ? '' : String(s);
        return el.innerHTML;
      }
    })();
  </script>
</body>
</html>
