<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ikite — About Me</title>
  {{template "head_common" .}}
  <style>
    .about-intro {
      margin: 0 0 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .about-intro a { font-weight: 600; }
    .cv-content {
      max-width: 820px;
      line-height: 1.55;
      font-size: 0.95rem;
    }
    .cv-content > p:first-child strong {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .cv-content > p:first-child {
      margin-bottom: 0.25em;
    }
    .cv-content p {
      margin: 0.55em 0;
    }
    .cv-content p:has(strong:only-child) {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 1.5em;
      margin-bottom: 0.45em;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .cv-content p:has(strong:only-child) strong {
      font-weight: 700;
    }
    .cv-content ul {
      margin: 0.4em 0 0.8em;
      padding-left: 1.35em;
    }
    .cv-content li {
      margin: 0.4em 0;
    }
    .cv-content li > p {
      margin: 0;
    }
    .cv-content a {
      font-weight: 600;
      word-break: break-word;
    }
    .cv-content em {
      color: var(--muted);
      font-style: normal;
      font-size: 0.92em;
    }
    .about-error {
      color: #a40000;
      margin: 0;
    }
    @media only screen and (max-width: 700px) {
      .cv-content { font-size: 0.9rem; }
      .cv-content > p:first-child strong { font-size: 1.4rem; }
      .cv-content p:has(strong:only-child) { font-size: 1rem; }
    }
  </style>
</head>
<body>
  {{template "nav" .}}
  <main class="page">
    <h1>About Me</h1>
    <p class="about-intro">CV sourced from <a href="{{.Source}}" target="_blank" rel="noopener noreferrer">GitHub</a>.</p>
    <article class="card cv-content">
      {{if .Error}}
      <p class="about-error">{{.Error}} <a href="{{.Source}}" target="_blank" rel="noopener noreferrer">View on GitHub</a></p>
      {{else}}
      {{.Content}}
      {{end}}
    </article>
  </main>
</body>
</html>
