<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}" data-theme="{{theme}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{T "title.graph"}}</title>
  {{template "head_common" .}}
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
  {{template "nav" .}}
  <main class="page">
    <h1>{{T "graph.heading"}}</h1>
    <div class="card" id="chart"></div>
  </main>
  <script id="graph-data" type="application/json">
  {"series":{
  {{$first := true}}{{range $loc, $pts := .Series}}{{if not $first}},{{end}}{{$first = false}}
  "{{$loc}}":[{{range $i, $p := $pts}}{{if $i}},{{end}}[{{index $p 0}},{{index $p 1}}]{{end}}]
  {{end}}
  },"locs":[{{range $i, $l := .Locs}}{{if $i}},{{end}}"{{$l}}"{{end}}]}
  </script>
  <script>
    const raw = JSON.parse(document.getElementById('graph-data').textContent);
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    const options = {
      series: raw.locs.map(name => ({ name, data: raw.series[name] || [] })),
      chart: {
        type: 'area',
        stacked: false,
        height: 420,
        background: 'transparent',
        foreColor: light ? '#334155' : '#c5d4dd',
        zoom: { type: 'x', enabled: true, autoScaleYaxis: true },
        toolbar: { autoSelected: 'zoom' }
      },
      theme: { mode: light ? 'light' : 'dark' },
      grid: { borderColor: light ? 'rgba(15,50,75,0.12)' : 'rgba(170,205,225,0.13)' },
      dataLabels: { enabled: false },
      markers: { size: 0 },
      fill: { type: 'gradient', gradient: { shadeIntensity: 1, inverseColors: false, opacityFrom: 0.45, opacityTo: 0.05 } },
      yaxis: { title: { text: '{{T "graph.wind_axis"}}' }, labels: { formatter: v => Math.round(v) } },
      xaxis: { type: 'datetime' },
      tooltip: { theme: light ? 'light' : 'dark', shared: true, y: { formatter: v => (v == null ? '' : Math.round(v) + '{{T "graph.tooltip_kt"}}') } }
    };
    new ApexCharts(document.querySelector('#chart'), options).render();
  </script>
</body>
</html>
